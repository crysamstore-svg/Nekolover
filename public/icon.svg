<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1830"/>
      <stop offset="50%" stop-color="#121019"/>
      <stop offset="100%" stop-color="#09070f"/>
    </linearGradient>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff79c6"/>
      <stop offset="50%" stop-color="#bd93f9"/>
      <stop offset="100%" stop-color="#ff85a2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#ff79c6" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Cat Ears -->
  <path d="M 120 180 L 160 70 L 220 150 Z" fill="#ff79c6" filter="url(#neonGlow)"/>
  <path d="M 135 170 L 165 95 L 205 150 Z" fill="#bd93f9"/>

  <path d="M 392 180 L 352 70 L 292 150 Z" fill="#ff79c6" filter="url(#neonGlow)"/>
  <path d="M 377 170 L 347 95 L 307 150 Z" fill="#bd93f9"/>

  <!-- Cute Cat Face Outline & Book Base -->
  <circle cx="256" cy="270" r="140" fill="#1a1528" stroke="url(#pawGrad)" stroke-width="8" filter="url(#neonGlow)"/>

  <!-- Open Magic Book at bottom -->
  <path d="M 160 380 Q 256 350 256 390 Q 256 350 352 380 L 352 420 Q 256 390 256 430 Q 256 390 160 420 Z" fill="#241b35" stroke="#ff79c6" stroke-width="5"/>
  <path d="M 256 390 L 256 430" stroke="#bd93f9" stroke-width="4"/>

  <!-- Main Center Cat Paw -->
  <g fill="url(#pawGrad)">
    <!-- Main Pad -->
    <ellipse cx="256" cy="285" rx="46" ry="38"/>
    <!-- 4 Toe Beans -->
    <circle cx="206" cy="225" r="16"/>
    <circle cx="240" cy="205" r="17"/>
    <circle cx="272" cy="205" r="17"/>
    <circle cx="306" cy="225" r="16"/>
  </g>

  <!-- Sparkles -->
  <path d="M 140 290 Q 150 290 150 280 Q 150 290 160 290 Q 150 290 150 300 Q 150 290 140 290 Z" fill="#ff79c6"/>
  <path d="M 360 270 Q 370 270 370 260 Q 370 270 380 270 Q 370 270 370 280 Q 370 270 360 270 Z" fill="#bd93f9"/>
  <circle cx="360" cy="180" r="5" fill="#ffffff" opacity="0.8"/>
  <circle cx="150" cy="210" r="4" fill="#ffffff" opacity="0.8"/>
</svg>
