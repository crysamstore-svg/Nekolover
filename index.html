      <style>
        #appmint-splash {
          position: fixed;
          inset: 0;
          z-index: 99999;
          background-color: #3f3a6d;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          transition: opacity 320ms cubic-bezier(0.16, 1, 0.3, 1), transform 320ms cubic-bezier(0.16, 1, 0.3, 1);
          will-change: opacity, transform;
        }
        #appmint-splash.is-hiding {
          opacity: 0;
          transform: scale(1.015);
          pointer-events: none;
        }
        .nl-splash-ambient {
          position: absolute;
          inset: 0;
          background: radial-gradient(circle at 50% 48%, rgba(167, 139, 250, 0.14) 0%, rgba(63, 58, 109, 0) 58%);
          pointer-events: none;
        }
        .nl-splash-center {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 16px;
          transform: translateY(-10px);
          animation: nlSplashEnter 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .nl-splash-book {
          width: min(82vw, 330px);
          height: auto;
          display: block;
          user-select: none;
        }
        .nl-splash-loader {
          position: absolute;
          bottom: max(38px, calc(env(safe-area-inset-bottom, 0px) + 34px));
          left: 0;
          right: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
        }
        .nl-splash-spinner {
          width: 20px;
          height: 20px;
          animation: nlSplashSpin 0.85s linear infinite;
        }
        .nl-splash-loading-text {
          font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
          font-size: 0.98rem;
          font-weight: 500;
          color: #ef4444;
          letter-spacing: 0.01em;
        }
        @keyframes nlSplashSpin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        @keyframes nlSplashEnter {
          from { opacity: 0; transform: translateY(0px) scale(0.97); }
          to { opacity: 1; transform: translateY(-10px) scale(1); }
        }
        @media (prefers-reduced-motion: reduce) {
          .nl-splash-center, .nl-splash-spinner { animation: none; }
          #appmint-splash { transition: opacity 150ms ease; }
        }
      </style>
      <script>
        (function() {
          var dismissed = false;
          window.__NEKO_SPLASH_START__ = Date.now();
          window.__dismissNekoSplash = function() {
            if (dismissed) return;
            dismissed = true;
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#121019');
            var el = document.getElementById('appmint-splash');
            if (!el) return;
            el.classList.add('is-hiding');
            window.setTimeout(function() {
              if (el && el.parentNode) el.parentNode.removeChild(el);
            }, 360);
          };
          // Guaranteed fallback so the splash never blocks the app even if JS stalls
          window.setTimeout(window.__dismissNekoSplash, 2600);
        })();
      </script>
