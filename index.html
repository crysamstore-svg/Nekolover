  <body class="h-full bg-[#121019] text-[#e2d6ff] font-sans antialiased selection:bg-pink-500 selection:text-black">
    <div id="root" class="h-full">
      <!-- Instant Splash Screen while React initializes -->
      <div style="min-height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #1e1830 0%, #121019 100%); color: #ff79c6; font-family: 'Quicksand', system-ui, -apple-system, sans-serif; text-align: center; padding: 20px; box-sizing: border-box;">
        <div style="position: relative; margin-bottom: 16px;">
          <div style="font-size: 3.5rem; filter: drop-shadow(0 0 20px rgba(255, 121, 198, 0.4)); animation: nekoPulse 1.6s ease-in-out infinite alternate;">🐾🖤</div>
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 800; margin: 0 0 6px 0; background: linear-gradient(135deg, #f59e0b, #ec4899, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.05em;">

        </h1>
        <p style="font-size: 0.82rem; color: #a78bfa; margin: 0 0 20px 0; font-weight: 500;">
          Abriendo tu biblioteca Kawaii Dark...
        </p>
        <div style="width: 140px; height: 3px; background: rgba(255, 255, 255, 0.08); border-radius: 999px; overflow: hidden; position: relative;">
          <div style="width: 50%; height: 100%; background: linear-gradient(90deg, #ec4899, #f59e0b); border-radius: 999px; animation: nekoBar 1.2s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes nekoPulse {
            0% { transform: scale(0.96); opacity: 0.85; }
            100% { transform: scale(1.06); opacity: 1; }
          }
          @keyframes nekoBar {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Bloque de Integración Supabase: Validación de Código Premium -->
    <script>
      const SUPABASE_URL = "https://jeplkoloixbkvgqwxkez.supabase.co/rest/v1/";
      const SUPABASE_ANON_KEY = "sb_publishable_7P6iF17OzgWWgWfbc3rg9Q_LXP_Gp1v";

      // Función para verificar código en la tabla suscripciones de Supabase mediante GET fetch
      async function verificarCodigo(codigo) {
        if (!codigo || typeof codigo !== "string" || !codigo.trim()) {
          console.warn("Código no proporcionado");
          return false;
        }

        const cleanCode = codigo.trim();
        const upperCode = cleanCode.toUpperCase();
        const candidateCodes = cleanCode === upperCode ? [cleanCode] : [upperCode, cleanCode];
        const urls = [
          ...candidateCodes.map((c) => `${SUPABASE_URL}suscripciones?codigo=eq.${encodeURIComponent(c)}`),
          `${SUPABASE_URL}suscripciones?codigo=ilike.${encodeURIComponent(cleanCode)}`,
          `${SUPABASE_URL}suscripciones?codigo_activacion=eq.${encodeURIComponent(cleanCode)}`
        ];

        for (const url of urls) {
          try {
            const response = await fetch(url, {
              method: "GET",
              headers: {
                "apikey": SUPABASE_ANON_KEY,
                "Authorization": "Bearer " + SUPABASE_ANON_KEY,
                "Accept": "application/json"
              }
            });

            if (response.ok) {
              const data = await response.json();

              if (Array.isArray(data) && data.length > 0) {
                const activeMatch = data.find((row) => {
                  const est = String(row.estado || "").trim().toLowerCase();
                  return est === "activo" || est === "active";
                });
                if (activeMatch) {
                  const matchedCode = String(activeMatch.codigo || activeMatch.codigo_activacion || cleanCode).trim();
                  // Guardar usuario_premium = true en el localStorage de la app
                  localStorage.setItem("usuario_premium", "true");

                  // Sincronizar datos de suscripción para el lector
                  const subData = {
                    isVip: true,
                    subscribedAt: Date.now(),
                    expiresAt: Date.now() + 30 * 24 * 60 * 60 * 1000,
                    planName: "Suscripción Mensual VIP ($2 USD/mes)",
                    paymentMethod: `Supabase [${matchedCode}]`,
                    autoRenew: true
                  };
                  localStorage.setItem("nl_vip_subscription", JSON.stringify(subData));

                  // Disparar evento para actualizar la interfaz al instante
                  if (window.dispatchEvent) {
                    window.dispatchEvent(new CustomEvent("vip_status_changed", { detail: { isVip: true, code: matchedCode } }));
                  }

                  console.log("¡Código válido! usuario_premium = true guardado en localStorage.");
                  return true;
                }
              }
            }
          } catch (error) {
            console.error("Error al verificar código con Supabase:", error);
          }
        }

        console.warn("Código no encontrado o inactivo en Supabase.");
        return false;
      }

      // Exponer globalmente para App Mint y la app
      window.SUPABASE_URL = SUPABASE_URL;
      window.SUPABASE_ANON_KEY = SUPABASE_ANON_KEY;
      window.verificarCodigo = verificarCodigo;
    </script>
  </body>
</html>
