    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "NekoLover Read",
        "url": "https://www.nekolover.online/",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "All",
        "inLanguage": "es",
        "description": "Lector digital de libros EPUB, PDF y texto con estantería 3D, fichas bibliográficas, citas literarias, marcadores y personalización de lectura.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Security & Mobile Metadata -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#121019" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NekoLover" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />

    <!-- Google Fonts: Dark Reborn & Kawaii Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Pirata+One&family=UnifrakturMaguntia&family=Creepster&family=Quicksand:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <!-- PDF.js library (deferred for fast startup) -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script>
      window.addEventListener('DOMContentLoaded', function() {
        if (window.pdfjsLib) {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
      });
    </script>
  </head>
  <body class="h-full bg-[#121019] text-[#e2d6ff] font-sans antialiased selection:bg-pink-500 selection:text-black">
    <div id="root" class="h-full">
      <!-- Instant Splash Screen while React initializes -->
      <div style="min-height: 100dvh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #1e1830 0%, #121019 100%); color: #ff79c6; font-family: 'Quicksand', system-ui, -apple-system, sans-serif; text-align: center; padding: 20px; box-sizing: border-box;">
        <div style="position: relative; margin-bottom: 16px;">
          <img src="/pwa-192x192.png" alt="NekoLover Read" style="width: 88px; height: 88px; border-radius: 22px; object-fit: cover; border: 2px solid rgba(255, 121, 198, 0.45); box-shadow: 0 0 26px rgba(255, 121, 198, 0.35); animation: nekoPulse 1.6s ease-in-out infinite alternate;" />
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 800; margin: 0 0 6px 0; background: linear-gradient(135deg, #f59e0b, #ec4899, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.05em;">
          NekoLover Read
        </h1>
        <p style="font-size: 0.82rem; color: #a78bfa; margin: 0 0 20px 0; font-weight: 500;">
          Abriendo tu biblioteca Kawaii Dark...
        </p>
        <div style="width: 140px; height: 3px; background: rgba(255, 255, 255, 0.08); border-radius: 999px; overflow: hidden; position: relative;">
          <div style="width: 50%; height: 100%; background: linear-gradient(90deg, #ec4899, #f59e0b); border-radius: 999px; animation: nekoBar 1.2s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes nekoPulse {
            0% { transform: scale(0.96); opacity: 0.85; }
            100% { transform: scale(1.06); opacity: 1; }
          }
          @keyframes nekoBar {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
